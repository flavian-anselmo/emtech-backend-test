version: "3.3"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - postgres

    volumes:
      - ./:/usr/src/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: emtech1234
      DATABASE_NAME: emtech-db
      DATABASE_USERNAME: emtech
      SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      ALGORITHM: HS256


  postgres:
    image: postgres:14

    restart: always

    environment:
      POSTGRES_PASSWORD: emtech1234
      POSTGRES_DB: emtech-db
      POSTGRES_USER: emtech

    volumes:
      - postgresql-db-volume:/var/lib/postgresql/data


volumes:
  postgresql-db-volume: